name: security-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic CLI smoke test
        run: |
          python src/cli.py data/synthetic_findings.csv --output /tmp/contextual-report.md
          test -s /tmp/contextual-report.md
          grep -q "F-1001" /tmp/contextual-report.md
